<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 282" role="img"><title>Три ефекти на поверхні</title><desc>Зразки умовно показують відмінність між матовим фоном, локальним глянцем і металізованим блиском.</desc><defs><linearGradient id="gold"><stop stop-color="#946523"/><stop offset=".45" stop-color="#fbe3a6"/><stop offset="1" stop-color="#b87c2d"/></linearGradient><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="7" height="7" fill="#f5dfbf"/><path d="M0 0v7" stroke="#b47844"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#69516e"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#30253e;text-anchor:middle;font-size:16px}.axis{stroke:#69516e;fill:none;marker-end:url(#arrow)}.dash{fill:none;stroke:#a55020;stroke-width:3;stroke-dasharray:8 5}</style><rect width="720" height="282" rx="12" fill="#fcf7f2"/><text x="360" y="30" font-weight="700">Три ефекти на поверхні</text><rect x="36" y="78" width="180" height="90" rx="8" fill="#e1d4dc"/><text x="126" y="208">Матова поверхня</text><rect x="270" y="78" width="180" height="90" rx="8" fill="#d9bed7"/><ellipse cx="360" cy="123" rx="66" ry="14" fill="#fff" opacity=".78" transform="rotate(-23 360 123)"/><text x="360" y="208">Вибірковий глянець</text><rect x="504" y="78" width="180" height="90" rx="8" fill="url(#gold)"/><text x="594" y="208">Металізована фольга</text></svg>