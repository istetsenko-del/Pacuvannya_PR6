<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 282" role="img"><title>Окремі шари одного макета</title><desc>Зіставте вміст шарів та перевірте, чи збігається їхня геометрична прив’язка.</desc><defs><linearGradient id="gold"><stop stop-color="#946523"/><stop offset=".45" stop-color="#fbe3a6"/><stop offset="1" stop-color="#b87c2d"/></linearGradient><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="7" height="7" fill="#f5dfbf"/><path d="M0 0v7" stroke="#b47844"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#69516e"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#30253e;text-anchor:middle;font-size:16px}.axis{stroke:#69516e;fill:none;marker-end:url(#arrow)}.dash{fill:none;stroke:#a55020;stroke-width:3;stroke-dasharray:8 5}</style><rect width="720" height="282" rx="12" fill="#fcf7f2"/><text x="360" y="30" font-weight="700">Окремі шари одного макета</text><rect x="40" y="76" width="145" height="120" rx="6" fill="#fff" stroke="#b5a0b5"/><rect x="85" y="100" width="90" height="70" fill="#d6bbd5"/><text x="112" y="227">Друк CMYK</text><rect x="205" y="76" width="145" height="120" rx="6" fill="#fff" stroke="#b5a0b5"/><rect x="250" y="102" width="90" height="27" fill="#30253e"/><text x="277" y="227">Маска лаку</text><rect x="370" y="76" width="145" height="120" rx="6" fill="#fff" stroke="#b5a0b5"/><rect x="415" y="148" width="90" height="23" fill="#30253e"/><text x="442" y="227">Маска фольги</text><rect x="535" y="76" width="145" height="120" rx="6" fill="#fff" stroke="#b5a0b5"/><rect x="580" y="95" width="90" height="84" fill="none" stroke="#69516e" stroke-dasharray="6 4"/><text x="607" y="227">Контур</text></svg>