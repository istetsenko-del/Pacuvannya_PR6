<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 282" role="img"><title>Панелі розгортки</title><desc>На схемі подано ширини панелей. Клейовий клапан виділено штрихуванням.</desc><defs><linearGradient id="gold"><stop stop-color="#946523"/><stop offset=".45" stop-color="#fbe3a6"/><stop offset="1" stop-color="#b87c2d"/></linearGradient><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="7" height="7" fill="#f5dfbf"/><path d="M0 0v7" stroke="#b47844"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#69516e"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#30253e;text-anchor:middle;font-size:16px}.axis{stroke:#69516e;fill:none;marker-end:url(#arrow)}.dash{fill:none;stroke:#a55020;stroke-width:3;stroke-dasharray:8 5}</style><rect width="720" height="282" rx="12" fill="#fcf7f2"/><text x="360" y="30" font-weight="700">Панелі розгортки</text><rect x="78" y="90" width="30" height="128" fill="url(#hatch)"/><rect x="108" y="90" width="180" height="128" fill="#fff"/><rect x="288" y="90" width="90" height="128" fill="#e9dce8"/><rect x="378" y="90" width="180" height="128" fill="#fff"/><rect x="558" y="90" width="90" height="128" fill="#e9dce8"/><path d="M78 90H648V218H78Z M108 90V218 M288 90V218 M378 90V218 M558 90V218" fill="none" stroke="#735e79"/><rect x="138" y="106" width="120" height="21" fill="#cdb0d1"/><rect x="138" y="154" width="120" height="16" fill="#eac67d"/><text x="93" y="245">10</text><text x="198" y="245">60</text><text x="333" y="245">30</text><text x="468" y="245">60</text><text x="603" y="245">30</text><text x="665" y="246">мм</text><text x="198" y="196">Лицьова</text></svg>