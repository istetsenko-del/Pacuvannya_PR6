<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 282" role="img"><title>Перевірка суміщення</title><desc>Суцільний контур позначає друк, пунктирний — положення маски. Зміщення на схемі збільшено для наочності.</desc><defs><linearGradient id="gold"><stop stop-color="#946523"/><stop offset=".45" stop-color="#fbe3a6"/><stop offset="1" stop-color="#b87c2d"/></linearGradient><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="7" height="7" fill="#f5dfbf"/><path d="M0 0v7" stroke="#b47844"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#69516e"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#30253e;text-anchor:middle;font-size:16px}.axis{stroke:#69516e;fill:none;marker-end:url(#arrow)}.dash{fill:none;stroke:#a55020;stroke-width:3;stroke-dasharray:8 5}</style><rect width="720" height="282" rx="12" fill="#fcf7f2"/><text x="360" y="30" font-weight="700">Перевірка суміщення</text><rect x="91" y="87" width="210" height="101" rx="15" fill="#eee1eb" stroke="#4a3456" stroke-width="3"/><rect x="91" y="87" width="210" height="101" rx="15" class="dash"/><rect x="410" y="87" width="210" height="101" rx="15" fill="#eee1eb" stroke="#4a3456" stroke-width="3"/><rect x="432" y="101" width="210" height="101" rx="15" class="dash"/><text x="196" y="236">Контури збігаються</text><text x="519" y="236">Контури зміщено</text></svg>