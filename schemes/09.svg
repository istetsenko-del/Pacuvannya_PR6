<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 282" role="img"><title>Ознаки браку на пробі</title><desc>Три ознаки для діагностики. Зафіксуйте місце дефекту й запропонуйте перевірку на пробній серії.</desc><defs><linearGradient id="gold"><stop stop-color="#946523"/><stop offset=".45" stop-color="#fbe3a6"/><stop offset="1" stop-color="#b87c2d"/></linearGradient><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="7" height="7" fill="#f5dfbf"/><path d="M0 0v7" stroke="#b47844"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#69516e"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#30253e;text-anchor:middle;font-size:16px}.axis{stroke:#69516e;fill:none;marker-end:url(#arrow)}.dash{fill:none;stroke:#a55020;stroke-width:3;stroke-dasharray:8 5}</style><rect width="720" height="282" rx="12" fill="#fcf7f2"/><text x="360" y="30" font-weight="700">Ознаки браку на пробі</text><rect x="61" y="83" width="135" height="86" rx="7" fill="#e9dce8" stroke="#69516e"/><rect x="75" y="93" width="135" height="86" rx="7" class="dash"/><text x="135" y="231">Зсув лаку</text><rect x="286" y="101" width="148" height="54" rx="4" fill="url(#gold)"/><path d="M319 101l16 21 -12 33h19l13-25 -9-29z M405 101l-14 24 20 30h-11l-20-28 12-26z" fill="#fcf7f2"/><text x="360" y="231">Пропуски фольги</text><path d="M538 172v-76h100v76l-35-45h-26z" fill="#e9dce8" stroke="#69516e"/><path d="M548 170l36-39" stroke="#b75f39" stroke-width="6"/><text x="588" y="231">Відкритий шов</text></svg>