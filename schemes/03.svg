<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 282" role="img"><title>Координати лицьової панелі</title><desc>Початок координат у верхньому лівому куті. Кольором показані габарити двох масок.</desc><defs><linearGradient id="gold"><stop stop-color="#946523"/><stop offset=".45" stop-color="#fbe3a6"/><stop offset="1" stop-color="#b87c2d"/></linearGradient><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="7" height="7" fill="#f5dfbf"/><path d="M0 0v7" stroke="#b47844"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#69516e"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#30253e;text-anchor:middle;font-size:16px}.axis{stroke:#69516e;fill:none;marker-end:url(#arrow)}.dash{fill:none;stroke:#a55020;stroke-width:3;stroke-dasharray:8 5}</style><rect width="720" height="282" rx="12" fill="#fcf7f2"/><text x="360" y="30" font-weight="700">Координати лицьової панелі</text><rect x="295" y="49" width="108" height="216" fill="#fff" stroke="#564366"/><rect x="313" y="76" width="72" height="36" fill="#cdb0d1"/><rect x="313" y="157" width="72" height="27" fill="#eac67d"/><path d="M295 49H457 M295 49V274" class="axis"/><text x="274" y="52">0</text><text x="470" y="54">x</text><text x="280" y="274">y</text><text x="512" y="94">x 10–50 · y 15–35</text><text x="512" y="173">x 10–50 · y 60–75</text><text x="159" y="151">60 × 120 мм</text></svg>