<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 282" role="img"><title>Пачка для крему</title><desc>Навчальний макет зовнішньої пачки для крему. На лицьовій панелі відведено місце для логотипа й назви.</desc><defs><linearGradient id="gold"><stop stop-color="#946523"/><stop offset=".45" stop-color="#fbe3a6"/><stop offset="1" stop-color="#b87c2d"/></linearGradient><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="7" height="7" fill="#f5dfbf"/><path d="M0 0v7" stroke="#b47844"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#69516e"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#30253e;text-anchor:middle;font-size:16px}.axis{stroke:#69516e;fill:none;marker-end:url(#arrow)}.dash{fill:none;stroke:#a55020;stroke-width:3;stroke-dasharray:8 5}</style><rect width="720" height="282" rx="12" fill="#fcf7f2"/><text x="360" y="30" font-weight="700">Пачка для крему</text><polygon points="280,64 450,64 500,96 330,96" fill="#e8dedf"/><polygon points="450,64 500,96 500,258 450,226" fill="#c6b3c5"/><rect x="280" y="64" width="170" height="162" rx="4" fill="#fff8ef" stroke="#69516e"/><text x="365" y="125">ЛОГОТИП</text><text x="365" y="172" fill="#91691c">НАЗВА</text><text x="365" y="252">60 × 120 мм</text></svg>