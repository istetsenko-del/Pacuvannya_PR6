<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 282" role="img"><title>Специфікація для запуску</title><desc>Фінальний комплект пов’язує геометрію масок із матеріалами, маршрутом і критеріями приймання.</desc><defs><linearGradient id="gold"><stop stop-color="#946523"/><stop offset=".45" stop-color="#fbe3a6"/><stop offset="1" stop-color="#b87c2d"/></linearGradient><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="7" height="7" fill="#f5dfbf"/><path d="M0 0v7" stroke="#b47844"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#69516e"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#30253e;text-anchor:middle;font-size:16px}.axis{stroke:#69516e;fill:none;marker-end:url(#arrow)}.dash{fill:none;stroke:#a55020;stroke-width:3;stroke-dasharray:8 5}</style><rect width="720" height="282" rx="12" fill="#fcf7f2"/><text x="360" y="30" font-weight="700">Специфікація для запуску</text><rect x="165" y="49" width="390" height="43" rx="7" fill="#e9dce8"/><text x="360" y="76">Геометрія й файли</text><rect x="165" y="102" width="390" height="43" rx="7" fill="#f3d99f"/><text x="360" y="129">Матеріали й операції</text><rect x="165" y="155" width="390" height="43" rx="7" fill="#e9dce8"/><text x="360" y="182">Допуски та проба</text><rect x="165" y="208" width="390" height="43" rx="7" fill="#f3d99f"/><text x="360" y="235">Погоджена версія</text></svg>