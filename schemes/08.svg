<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 282" role="img"><title>Структура кошторису</title><desc>У кошторисі відокремлюють підготовчі витрати від тих, що залежать від кількості примірників.</desc><defs><linearGradient id="gold"><stop stop-color="#946523"/><stop offset=".45" stop-color="#fbe3a6"/><stop offset="1" stop-color="#b87c2d"/></linearGradient><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="7" height="7" fill="#f5dfbf"/><path d="M0 0v7" stroke="#b47844"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#69516e"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#30253e;text-anchor:middle;font-size:16px}.axis{stroke:#69516e;fill:none;marker-end:url(#arrow)}.dash{fill:none;stroke:#a55020;stroke-width:3;stroke-dasharray:8 5}</style><rect width="720" height="282" rx="12" fill="#fcf7f2"/><text x="360" y="30" font-weight="700">Структура кошторису</text><rect x="47" y="85" width="296" height="107" rx="12" fill="#eadde9"/><rect x="377" y="85" width="296" height="107" rx="12" fill="#f3d99f"/><text x="195" y="130">Підготовка</text><text x="195" y="160">форми та налагодження</text><text x="525" y="130">Наклад</text><text x="525" y="160">операції на примірник</text><text x="360" y="239">Порівнюйте кошториси для однакової кількості придатних пачок</text></svg>