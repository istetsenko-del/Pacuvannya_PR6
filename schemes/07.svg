<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 282" role="img"><title>Маршрут виготовлення</title><desc>Типовий навчальний маршрут розбито на блоки. Місце окремих операцій підтверджують пробою для вибраних матеріалів.</desc><defs><linearGradient id="gold"><stop stop-color="#946523"/><stop offset=".45" stop-color="#fbe3a6"/><stop offset="1" stop-color="#b87c2d"/></linearGradient><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="7" height="7" fill="#f5dfbf"/><path d="M0 0v7" stroke="#b47844"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#69516e"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#30253e;text-anchor:middle;font-size:16px}.axis{stroke:#69516e;fill:none;marker-end:url(#arrow)}.dash{fill:none;stroke:#a55020;stroke-width:3;stroke-dasharray:8 5}</style><rect width="720" height="282" rx="12" fill="#fcf7f2"/><text x="360" y="30" font-weight="700">Маршрут виготовлення</text><rect x="18" y="104" width="160" height="67" rx="8" fill="#e9dce8"/><text x="98" y="142" font-size="14">Друк</text><path d="M178 138h14" class="axis"/><rect x="192" y="104" width="160" height="67" rx="8" fill="#f3d99f"/><text x="272" y="142" font-size="14">Оздоблення</text><path d="M352 138h14" class="axis"/><rect x="366" y="104" width="160" height="67" rx="8" fill="#e9dce8"/><text x="446" y="142" font-size="14">Висікання й бігування</text><path d="M526 138h14" class="axis"/><rect x="540" y="104" width="160" height="67" rx="8" fill="#e9dce8"/><text x="620" y="142" font-size="14">Формування</text><text x="360" y="226">Перевіряйте придатність після операцій</text></svg>